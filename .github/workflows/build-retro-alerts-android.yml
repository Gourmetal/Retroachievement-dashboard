name: Build Gourmetal Retro Alerts

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose what to run"
        required: true
        default: build
        type: choice
        options:
          - build
          - inspect-sdk
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-retro-alerts-android.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || inputs.task == 'build'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gourmetal-Retro-Alerts-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  inspect-sdk:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'inspect-sdk'
    runs-on: ubuntu-latest

    steps:
      - name: Download Discord SDK release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Use the workflow's built-in, read-only repository token.
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \\
            /repos/Gourmetal/Retroachievement-dashboard/releases/assets/788554031 > support-asset.json
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \\
            /repos/Gourmetal/Retroachievement-dashboard/releases/assets/788525034 > aar-asset.json

          support_url="$(python3 -c 'import json; print(json.load(open("support-asset.json"))["browser_download_url"])')"
          aar_url="$(python3 -c 'import json; print(json.load(open("aar-asset.json"))["browser_download_url"])')"

          curl --fail --location --retry 3 --retry-delay 2 \\
            -H "Authorization: Bearer $GH_TOKEN" \\
            -H "Accept: application/octet-stream" \\
            "$support_url" --output discord-sdk-support.zip
          curl --fail --location --retry 3 --retry-delay 2 \\
            -H "Authorization: Bearer $GH_TOKEN" \\
            -H "Accept: application/octet-stream" \\
            "$aar_url" --output discord_partner_sdk.aar

          test -s discord-sdk-support.zip
          test -s discord_partner_sdk.aar

      - name: Inspect SDK package contents
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          output = ["# Discord SDK package inspection", ""]
          for filename in ("discord-sdk-support.zip", "discord_partner_sdk.aar"):
              path = Path(filename)
              output += [f"## {filename}", "", f"- Downloaded size: {path.stat().st_size:,} bytes"]
              if not zipfile.is_zipfile(path):
                  output += ["- **ERROR:** File is not a valid ZIP-compatible archive.", ""]
                  continue
              with zipfile.ZipFile(path) as archive:
                  entries = archive.infolist()
                  output += [f"- Entries: {len(entries)}", "", "### Contents"]
                  for entry in entries:
                      output.append(f"- `{entry.filename}` ({entry.file_size:,} bytes)")
                  if filename.endswith(".aar"):
                      names = [entry.filename for entry in entries]
                      output += ["", "### Android packaging signals"]
                      for candidate in ("AndroidManifest.xml", "classes.jar", "jni/"):
                          found = [name for name in names if name == candidate or name.startswith(candidate)]
                          output.append(f"- {candidate}: " + (", ".join(found) if found else "not found"))
              output.append("")
          Path("sdk-inspection-report.md").write_text("\\n".join(output), encoding="utf-8")
          PY

      - name: Upload SDK inspection report
        uses: actions/upload-artifact@v4
        with:
          name: discord-sdk-inspection-report
          path: sdk-inspection-report.md
          if-no-files-found: error
