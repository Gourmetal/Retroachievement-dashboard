name: Build Gourmetal Retro Alerts

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Choose what to run"
        required: true
        default: build
        type: choice
        options:
          - build
          - inspect-sdk
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-retro-alerts-android.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || inputs.task == 'build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.0.12077973 cmake;3.22.1"
      - name: Extract Discord native libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path("android-app/app")
          mapping = {
              "arm64": "arm64-v8a",
              "armeabi": "armeabi-v7a",
              "x86": "x86",
              "x86_64": "x86_64",
          }
          for archive_arch, android_abi in mapping.items():
              archive_path = root / f"discord-native-{archive_arch}.zip"
              with zipfile.ZipFile(archive_path) as archive:
                  entries = [name for name in archive.namelist()
                             if name.endswith(".so") and not name.startswith("/")]
                  if len(entries) != 1:
                      raise SystemExit(f"Expected one .so in {archive_path}, found {entries}")
                  destination = root / "src/main/jniLibs" / android_abi / "libdiscord_partner_sdk.so"
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(entries[0]))
                  print(f"Extracted {android_abi}: {destination.stat().st_size} bytes")

          jar_archive = root / "discord_partner_sdk.zip"
          with zipfile.ZipFile(jar_archive) as archive:
              jars = [name for name in archive.namelist() if name.endswith(".jar")]
              if len(jars) != 1:
                  raise SystemExit(f"Expected one SDK JAR in {jar_archive}, found {jars}")
              jar_destination = root / "libs" / "discord_partner_sdk.jar"
              jar_destination.parent.mkdir(parents=True, exist_ok=True)
              jar_destination.write_bytes(archive.read(jars[0]))
              print(f"Extracted Discord Android Java bindings: {jar_destination.stat().st_size} bytes")
          PY
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug
      - name: Re-sign APK with JAR-compatible v1 signature
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/debug/app-debug.apk"
          keystore="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$keystore")"
          if [ ! -s "$keystore" ]; then
            keytool -genkeypair -v -keystore "$keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          # Remove Gradle's existing JAR signature metadata before applying v1 signing.
          python3 - "$apk" <<'PY'
          import sys, zipfile
          from pathlib import Path
          apk = Path(sys.argv[1])
          temp = apk.with_suffix(".unsigned.apk")
          with zipfile.ZipFile(apk, "r") as source, zipfile.ZipFile(temp, "w") as target:
              for item in source.infolist():
                  name = item.filename.upper()
                  if name == "META-INF/MANIFEST.MF" or (name.startswith("META-INF/") and name.endswith((".SF", ".RSA", ".DSA", ".EC"))):
                      continue
                  target.writestr(item, source.read(item.filename))
          temp.replace(apk)
          PY
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$keystore" -storepass android -keypass android \
            -signedjar "$apk.signed" "$apk" androiddebugkey
          mv "$apk.signed" "$apk"
      - name: Verify APK package, signature, and metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "APK size:"
          stat -c '%s bytes' "$apk"
          echo "Checking ZIP/APK structure..."
          unzip -t "$apk"
          echo "Checking JAR v1 signature..."
          # jarsigner exits non-zero when Android library META-INF resources remain unsigned;
          # apksigner below is the authoritative APK signature compatibility check.
          jarsigner -verify -verbose -certs "$apk" || echo "JAR verifier reported unsigned META-INF resources; continuing to Android APK verification."
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          echo "Checking Android APK signature compatibility..."
          "$build_tools/apksigner" verify --verbose --min-sdk-version 26 "$apk" | tee signature-verification.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' signature-verification.txt
          echo "Reading package metadata..."
          "$build_tools/aapt" dump badging "$apk" | head -n 8
          echo "SHA-256:"
          sha256sum "$apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gourmetal-Retro-Alerts-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  inspect-sdk:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.task == 'inspect-sdk')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Inspect Java API and native exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, tempfile, subprocess
          from pathlib import Path

          root = Path("android-app/app")
          report = ["# Discord SDK deep inspection", ""]
          jar_zip = root / "discord_partner_sdk.zip"
          with zipfile.ZipFile(jar_zip) as archive:
              jar_entry = next((n for n in archive.namelist() if n.endswith(".jar")), None)
              if not jar_entry:
                  raise SystemExit("No JAR found in discord_partner_sdk.zip")
              with tempfile.TemporaryDirectory() as temp:
                  temp = Path(temp)
                  jar = temp / "discord_partner_sdk.jar"
                  jar.write_bytes(archive.read(jar_entry))
                  listing = subprocess.check_output(["jar", "tf", str(jar)], text=True)
                  classes = [n[:-6].replace("/", ".") for n in listing.splitlines()
                             if n.endswith(".class") and "$" not in n and n != "module-info.class"]
                  report += ["## Java archive", f"- Embedded JAR: {jar_entry}", f"- Class count: {len(classes)}", "", "### Classes"]
                  report += [f"- `{name}`" for name in classes]
                  report += ["", "### Public Java API"]
                  for name in classes:
                      result = subprocess.run(["javap", "-classpath", str(jar), "-public", name],
                                               text=True, capture_output=True)
                      if result.returncode == 0 and result.stdout.strip():
                          report += ["", f"#### `{name}`", "```java", result.stdout.strip(), "```"]
                  report += ["", "### RPC implementation bytecode"]
                  rpc_classes = (
                      "com.discord.socialsdk.DiscordRpcClient",
                      "com.discord.socialsdk.DiscordRpcClient$1",
                      "com.discord.socialsdk.DiscordRpcClient$2",
                      "com.discord.socialsdk.DiscordSocialSdkInit",
                      "com.discord.socialsdk.rpc.IDiscordRpcService",
                      "com.discord.socialsdk.rpc.IDiscordRpcService$Stub",
                      "com.discord.socialsdk.rpc.IDiscordRpcService$Stub$Proxy",
                      "com.discord.socialsdk.rpc.IDiscordRpcConnection",
                      "com.discord.socialsdk.rpc.IDiscordRpcConnection$Stub",
                      "com.discord.socialsdk.rpc.IDiscordRpcConnection$Stub$Proxy",
                      "com.discord.socialsdk.rpc.IDiscordRpcCallback",
                      "com.discord.socialsdk.rpc.IDiscordRpcCallback$Stub",
                  )
                  for name in rpc_classes:
                      result = subprocess.run(["javap", "-classpath", str(jar), "-c", "-p", name],
                                               text=True, capture_output=True)
                      if result.returncode == 0 and result.stdout.strip():
                          report += ["", f"#### `{name}`", "```java", result.stdout.strip(), "```"]
                      else:
                          report += ["", f"#### `{name}`", f"Bytecode unavailable: {result.stderr.strip()}"]

                  manifest = subprocess.run(["unzip", "-p", str(jar), "META-INF/MANIFEST.MF"],
                                             text=True, capture_output=True)
                  if manifest.stdout.strip():
                      report += ["", "### JAR manifest", "```", manifest.stdout.strip(), "```"]

          report += ["", "## Native library exports"]
          for arch in ("arm64", "armeabi", "x86", "x86_64"):
              archive_path = root / f"discord-native-{arch}.zip"
              with zipfile.ZipFile(archive_path) as archive:
                  so_name = next(n for n in archive.namelist() if n.endswith(".so"))
                  with tempfile.TemporaryDirectory() as temp:
                      so = Path(temp) / "libdiscord_partner_sdk.so"
                      so.write_bytes(archive.read(so_name))
                      symbols = subprocess.run(["nm", "-D", "--defined-only", str(so)],
                                               text=True, capture_output=True)
                      lines = [line for line in symbols.stdout.splitlines()
                               if "discord" in line.lower() or "presence" in line.lower()
                               or "rpc" in line.lower()]
                      report += ["", f"### {arch}", f"- Native file: `{so_name}`",
                                 f"- Matching exported symbols: {len(lines)}"]
                      report += [f"- `{line.strip()}`" for line in lines[:150]]
                      dynamic = subprocess.run(["readelf", "-d", str(so)],
                                               text=True, capture_output=True)
                      needed = [line.strip() for line in dynamic.stdout.splitlines()
                                if "(NEEDED)" in line]
                      report += ["- Dynamic dependencies: " + (", ".join(needed) if needed else "not reported")]

          Path("discord-sdk-deep-inspection.md").write_text("\n".join(report), encoding="utf-8")
          PY
      - name: Upload deep SDK inspection report
        uses: actions/upload-artifact@v4
        with:
          name: discord-sdk-deep-inspection
          path: discord-sdk-deep-inspection.md
          if-no-files-found: error
