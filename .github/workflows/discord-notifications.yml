YAML

name: RetroAchievements Phone Notifications

on:
  workflow_dispatch:
    inputs:
      resend_achievement_id:
        description: "Achievement ID to resend (leave blank for normal checking)"
        required: false
        type: string
        default: ""
      resend_last_hour:
        description: "Resend every achievement earned in the last 60 minutes"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: achievement-phone-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install artwork color sampler
        run: python -m pip install --quiet Pillow

      - name: Check achievements and notify phone
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_ACHIEVEMENT_ID: ${{ inputs.resend_achievement_id }}
          RESEND_LAST_HOUR: ${{ inputs.resend_last_hour }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          import io
          from pathlib import Path
          from PIL import Image

          USERNAME = "Gourmetal"
          LOOKBACK_MINUTES = 60
          UNLOCK_PAGE_SIZE = 500

          api_key = os.environ.get("RA_API_KEY")
          topic = os.environ.get("NTFY_TOPIC")
          resend_id = os.environ.get("RESEND_ACHIEVEMENT_ID", "").strip()
          resend_last_hour = os.environ.get("RESEND_LAST_HOUR", "false").lower() == "true"

          state_path = Path("data/notified-achievements.json")
          games_path = Path("data/games.json")

          if not api_key:
              raise RuntimeError("GitHub secret RA_API_KEY is missing.")

          if not topic:
              raise RuntimeError("GitHub secret NTFY_TOPIC is missing.")

          def api_get(endpoint, params):
              query = dict(params)
              query["y"] = api_key
              url = (
                  "https://retroachievements.org/API/"
                  + endpoint + "?" + urllib.parse.urlencode(query)
              )
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GourmeHub/3.0"}
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"{endpoint} returned HTTP {error.code}: {details}"
                  ) from error

          # LOAD GAME ARTWORK FROM THE DASHBOARD LIBRARY
          game_art = {}

          if games_path.exists():
              try:
                  library = json.loads(games_path.read_text())

                  for game in library.get("games", []):
                      game_id = game.get("gameId")
                      artwork = game.get("boxArt")

                      if game_id and artwork:
                          if artwork.startswith("https://"):
                              game_art[str(game_id)] = artwork
                          elif artwork.startswith("/"):
                              game_art[str(game_id)] = (
                                  "https://retroachievements.org" + artwork
                              )
              except (json.JSONDecodeError, AttributeError, TypeError):
                  print("Could not read local artwork library.")

          artwork_lookup_cache = {}

          def get_game_artwork(game_id):
              game_id = str(game_id)

              if game_id in artwork_lookup_cache:
                  return artwork_lookup_cache[game_id]

              try:
                  data = api_get("API_GetGame.php", {"i": game_id})
                  image = (
                      data.get("ImageBoxArt")
                      or data.get("ImageIcon")
                      or data.get("GameIcon")
                  )

                  if image and image.startswith("/"):
                      image = "https://retroachievements.org" + image

                  if image and not image.startswith("https://"):
                      image = None

                  artwork_lookup_cache[game_id] = image
                  return image

              except Exception as error:
                  print(f"Artwork lookup failed: {error}")
                  artwork_lookup_cache[game_id] = None
                  return None

          def get_recent():
              data = api_get(
                  "API_GetUserRecentAchievements.php",
                  {"u": USERNAME, "m": LOOKBACK_MINUTES}
              )

              if not isinstance(data, list):
                  raise RuntimeError(
                      "Unexpected response from recent achievements API."
                  )

              return data

          # GAME-SPECIFIC NOTIFICATION THEMES
          def get_game_style(game):
              name = str(game or "").lower()

              themes = [
                  {
                      "match": ["zelda", "minish cap", "ocarina of time",
                                "majora's mask", "link's awakening",
                                "a link to the past", "wind waker",
                                "twilight princess", "skyward sword"],
                      "banner": "🗡️ HYRULE ADVENTURE!",
                      "flavor": "Another legend is written in Hyrule.",
                      "color": "#C5A43B",
                      "color_name": "Hyrule Gold"
                  },
                  {
                      "match": ["pokemon", "pokémon"],
                      "banner": "⚡ POKÉDEX UPDATE!",
                      "flavor": "A new achievement has joined your collection!",
                      "color": "#F4C430",
                      "color_name": "Pokémon Yellow"
                  },
                  {
                      "match": ["mario", "super mario", "luigi"],
                      "banner": "🍄 MUSHROOM KINGDOM NEWS!",
                      "flavor": "It's-a achievement time!",
                      "color": "#D83B32",
                      "color_name": "Mario Red"
                  },
                  {
                      "match": ["sonic", "knuckles", "tails"],
                      "banner": "💨 SONIC SPEED UNLOCK!",
                      "flavor": "Gotta go fast! Another achievement secured.",
                      "color": "#147FC0",
                      "color_name": "Sonic Blue"
                  },
                  {
                      "match": ["metroid", "samus"],
                      "banner": "🚀 GALACTIC MISSION COMPLETE!",
                      "flavor": "Mission progress confirmed, bounty hunter.",
                      "color": "#7B9B45",
                      "color_name": "Metroid Green"
                  },
                  {
                      "match": ["castlevania"],
                      "banner": "🦇 CASTLE VICTORY!",
                      "flavor": "Another dark challenge has been conquered.",
                      "color": "#713B9B",
                      "color_name": "Castlevania Purple"
                  },
                  {
                      "match": ["mega man", "megaman", "rockman"],
                      "banner": "🤖 ROBOT MASTER DEFEATED!",
                      "flavor": "Another mission successfully completed.",
                      "color": "#287FC2",
                      "color_name": "Mega Man Blue"
                  },
                  {
                      "match": ["kirby"],
                      "banner": "⭐ DREAM LAND CELEBRATION!",
                      "flavor": "A new accomplishment joins the stars!",
                      "color": "#D94B91",
                      "color_name": "Kirby Pink"
                  },
                  {
                      "match": ["donkey kong"],
                      "banner": "🍌 JUNGLE VICTORY!",
                      "flavor": "Another challenge conquered in the jungle.",
                      "color": "#A67C35",
                      "color_name": "Jungle Gold"
                  },
                  {
                      "match": ["final fantasy"],
                      "banner": "⚔️ FINAL FANTASY VICTORY!",
                      "flavor": "Your legend grows stronger with every quest.",
                      "color": "#6A55A5",
                      "color_name": "Final Fantasy Violet"
                  },
                  {
                      "match": ["street fighter", "mortal kombat",
                                "tekken", "king of fighters"],
                      "banner": "🥊 FIGHTER VICTORY!",
                      "flavor": "Flawless effort! Another challenge cleared.",
                      "color": "#C83D35",
                      "color_name": "Fighting Red"
                  }
              ]

              for theme in themes:
                  if any(keyword in name for keyword in theme["match"]):
                      return theme

              return {
                  "banner": "🎮 RETRO GAMING UPDATE!",
                  "flavor": "Another achievement added to your collection.",
                  "color": None,
                  "color_name": "Artwork colors"
              }

          # SAMPLE A DOMINANT COLOR FROM THE GAME ARTWORK
          def get_artwork_color(image_url):
              if not image_url:
                  return None

              try:
                  request = urllib.request.Request(
                      image_url,
                      headers={"User-Agent": "GourmeHub/3.0"}
                  )

                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read(8 * 1024 * 1024)

                  image = Image.open(io.BytesIO(raw)).convert("RGB")
                  image.thumbnail((96, 96))

                  quantized = image.quantize(
                      colors=8,
                      method=Image.Quantize.MEDIANCUT
                  )

                  palette = quantized.getpalette()
                  counts = quantized.getcolors(96 * 96) or []

                  if not counts or not palette:
                      return None

                  index = max(counts, key=lambda item: item[0])[1]
                  offset = index * 3
                  red, green, blue = palette[offset:offset + 3]

                  return "#{:02X}{:02X}{:02X}".format(
                      red, green, blue
                  )

              except Exception as error:
                  print(f"Artwork color sampling failed: {error}")
                  return None

          def get_color_square(hex_color):
              if not hex_color or len(hex_color) != 7:
                  return "⬜"

              red, green, blue = (
                  int(hex_color[i:i + 2], 16) for i in (1, 3, 5)
              )

              if red > green * 1.25 and red > blue * 1.25:
                  return "🟥"
              if green > red * 1.2 and green > blue * 1.2:
                  return "🟩"
              if blue > red * 1.2 and blue > green * 1.1:
                  return "🟦"
              if red > 150 and green > 100 and blue < 120:
                  return "🟨"
              if red > 130 and blue > 130 and green < 150:
                  return "🟪"

              return "⬜"

          def get_rarity_text(achievement):
              for field in ("Rarity", "RarityPercent", "RarityPercentage"):
                  value = achievement.get(field)

                  if value is not None:
                      try:
                          return f"💎 Rarity: {float(value):g}%"
                      except (ValueError, TypeError):
                          pass

              ratio = achievement.get("TrueRatio")

              if ratio is not None:
                  try:
                      return f"✨ True Ratio: {float(ratio):g}"
                  except (ValueError, TypeError):
                      pass

              return None

          def send_notification(achievement):
              title = achievement.get("Title") or "Achievement unlocked"
              game = achievement.get("GameTitle") or "Unknown game"
              description = (
                  achievement.get("Description")
                  or achievement.get("AchievementDescription")
                  or "No description was provided by RetroAchievements."
              )

              points = achievement.get("Points", 0)
              achievement_id = achievement.get("AchievementID")
              game_id = achievement.get("GameID")

              try:
                  points_number = int(points or 0)
              except (ValueError, TypeError):
                  points_number = 0

              hardcore = int(achievement.get("HardcoreMode") or 0) == 1
              mode = "HARDCORE" if hardcore else "SOFTCORE"

              achievement_url = None
              game_url = None

              if achievement_id:
                  achievement_url = (
                      "https://retroachievements.org/achievement/"
                      + str(achievement_id)
                  )

              if game_id:
                  game_url = (
                      "https://retroachievements.org/game/"
                      + str(game_id)
                  )

              # CHOOSE FRANCHISE COLORS OR SAMPLE THE DASHBOARD ARTWORK
              game_style = get_game_style(game)

              artwork = game_art.get(str(game_id)) if game_id else None

              if not artwork and game_id:
                  artwork = get_game_artwork(game_id)

              accent_color = game_style.get("color")
              color_source = game_style.get(
                  "color_name", "Artwork colors"
              )

              if not accent_color:
                  accent_color = get_artwork_color(artwork)

                  if accent_color:
                      color_source = "Game artwork"

              if not accent_color:
                  accent_color = "#667788"
                  color_source = "Retro fallback"

              tags = ["trophy", "video_game"]
              priority = "default"
              special_label = "🏆 ACHIEVEMENT UNLOCKED!"

              rarity_text = get_rarity_text(achievement)

              if points_number >= 50:
                  special_label = "🌟 BIG ACHIEVEMENT UNLOCKED!"
                  tags.append("star")
                  priority = "high"
              elif points_number >= 25:
                  special_label = "🏆 MAJOR ACHIEVEMENT UNLOCKED!"
                  tags.append("tada")
                  priority = "high"

              try:
                  true_ratio = float(achievement.get("TrueRatio") or 0)

                  if true_ratio >= 10:
                      special_label = "💎 CHALLENGING ACHIEVEMENT UNLOCKED!"
                      tags.append("gem")
                      priority = "high"

              except (ValueError, TypeError):
                  pass

              if hardcore:
                  tags.append("fire")
              else:
                  tags.append("video_game")

              notification_title = f"Achievement unlocked: {game}"

              lines = [
                  game_style["banner"],
                  game_style["flavor"],
                  "",
                  special_label,
                  "",
                  f"🎮 {game}",
                  "",
                  f"🏅 {title}",
                  "",
                  "📜 DESCRIPTION",
                  description,
                  "",
                  f"⭐ POINTS: {points_number}",
                  f"🎯 MODE: {mode}",
                  f"👤 PLAYER: {USERNAME}",
                  "",
                  f"{get_color_square(accent_color)} COLOR THEME: {color_source} {accent_color}"
              ]

              if rarity_text:
                  lines.extend(["", rarity_text])

              if achievement_url:
                  lines.extend([
                      "",
                      "🔗 VIEW ACHIEVEMENT",
                      achievement_url
                  ])

              if game_url:
                  lines.extend([
                      "",
                      "🕹️ VIEW GAME",
                      game_url
                  ])

              message = "\n".join(lines)

              headers = {
                  "Content-Type": "text/plain; charset=utf-8",
                  "Title": notification_title,
                  "Priority": priority,
                  "Tags": ",".join(tags)
              }

              if artwork:
                  headers["Icon"] = artwork
                  headers["Attach"] = artwork
                  print(f"Using game artwork for {game}.")

              if achievement_url:
                  headers["Click"] = achievement_url

              encoded_topic = urllib.parse.quote(topic, safe="")
              url = f"https://ntfy.sh/{encoded_topic}"

              request = urllib.request.Request(
                  url,
                  data=message.encode("utf-8"),
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.loads(
                          response.read().decode("utf-8")
                      )

                      print(
                          f"NTFY ACCEPTED: {title} — {game} "
                          f"(HTTP {response.status})"
                      )
                      print(
                          f"Notification theme: {game_style['banner']}"
                      )
                      print(
                          f"Notification color: {accent_color} ({color_source})"
                      )

                      return result

              except urllib.error.HTTPError as error:
                  details = error.read().decode(
                      "utf-8", errors="replace"
                  )

                  print(f"ntfy response: {details}")

                  raise RuntimeError(
                      f"ntfy rejected notification: HTTP {error.code}."
                  ) from error

          # RESEND LAST HOUR MODE
          if resend_last_hour:
              if resend_id:
                  raise RuntimeError(
                      "Choose either a single achievement ID or the last-hour resend, not both."
                  )

              recent = get_recent()
              print(f"Found {len(recent)} achievement(s) in the last hour.")

              sent = 0

              for item in reversed(recent):
                  send_notification(item)
                  sent += 1

              print(f"Last-hour resend completed: {sent} notification(s).")
              print("Notification history was not changed.")

          # MANUAL RESEND MODE
          elif resend_id:
              if not resend_id.isdigit():
                  raise RuntimeError("Enter a numeric achievement ID.")

              achievement_data = api_get(
                  "API_GetAchievementUnlocks.php",
                  {"a": resend_id, "c": 1, "o": 0}
              )

              achievement_info = achievement_data.get("Achievement", {})
              game_info = achievement_data.get("Game", {})

              if not achievement_info.get("ID") or not game_info.get("ID"):
                  raise RuntimeError("Could not find that achievement ID.")

              
              unlocks = achievement_data.get("Unlocks", [])
              if not isinstance(unlocks, list):
                  raise RuntimeError("Unexpected unlock history response.")

              player_unlocks = [
                  item for item in unlocks
                  if str(item.get("User", "")).lower() == USERNAME.lower()
              ]

              if not player_unlocks:
                  raise RuntimeError(
                      f"No unlock by {USERNAME} was found for achievement {resend_id}."
                  )

              unlock = player_unlocks[0]
              item = {
                  "AchievementID": achievement_info.get("ID"),
                  "Title": achievement_info.get("Title"),
                  "Description": achievement_info.get("Description"),
                  "Points": achievement_info.get("Points", 0),
                  "TrueRatio": achievement_info.get("TrueRatio"),
                  "GameID": game_info.get("ID"),
                  "GameTitle": game_info.get("Title"),
                  "HardcoreMode": unlock.get("HardcoreMode", 0)
              }

              send_notification(item)
              print(f"Manual resend completed for achievement {resend_id}.")

          # NORMAL AUTOMATIC CHECKING MODE
          else:
              if state_path.exists():
                  try:
                      stored = json.loads(state_path.read_text())

                      if not isinstance(stored, list):
                          raise ValueError("History must be a JSON list.")

                      seen = set(str(value) for value in stored)

                  except (json.JSONDecodeError, ValueError, TypeError) as error:
                      raise RuntimeError(
                          "Notification history is invalid."
                      ) from error
              else:
                  seen = set()

              recent = get_recent()
              print(f"RetroAchievements returned {len(recent)} recent unlocks.")

              new_items = [
                  item for item in recent
                  if item.get("AchievementID")
                  and str(item["AchievementID"]) not in seen
              ]

              print(f"New achievements to notify: {len(new_items)}")
              sent_ids = []

              for item in reversed(new_items):
                  send_notification(item)
                  sent_ids.append(str(item["AchievementID"]))

              seen.update(sent_ids)
              state_path.parent.mkdir(parents=True, exist_ok=True)
              state_path.write_text(
                  json.dumps(sorted(seen), indent=2) + "\n"
              )

              print(f"Notification history now contains {len(seen)} IDs.")
              print(f"Successfully sent {len(sent_ids)} notification(s).")
                        PY

      - name: Save notification history
        if: ${{ inputs.resend_achievement_id == '' && inputs.resend_last_hour != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified-achievements.json
          git diff --cached --quiet || git commit -m "Track phone achievement notifications"
          git push
