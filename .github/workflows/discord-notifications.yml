
name: RetroAchievements Phone Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: achievement-phone-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for new achievements and notify phone
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path

          USERNAME = "Gourmetal"
          LOOKBACK_MINUTES = 60

          api_key = os.environ.get("RA_API_KEY")
          topic = os.environ.get("NTFY_TOPIC")

          state_path = Path("data/notified-achievements.json")
          games_path = Path("data/games.json")

          if not api_key:
              raise RuntimeError("GitHub secret RA_API_KEY is missing.")

          if not topic:
              raise RuntimeError("GitHub secret NTFY_TOPIC is missing.")

          # Load artwork already stored in Gourme Hub.
          game_art = {}

          if games_path.exists():
              try:
                  library = json.loads(games_path.read_text())

                  for game in library.get("games", []):
                      game_id = game.get("gameId")
                      artwork = game.get("boxArt")

                      if game_id and artwork:
                          if artwork.startswith("https://"):
                              game_art[str(game_id)] = artwork
                          elif artwork.startswith("/"):
                              game_art[str(game_id)] = (
                                  "https://retroachievements.org" + artwork
                              )

              except (json.JSONDecodeError, AttributeError, TypeError):
                  print("Could not read local artwork library.")

          print(f"Loaded artwork for {len(game_art)} games.")

          # Cache API lookups during this workflow run.
          artwork_lookup_cache = {}

          def get_game_artwork(game_id):
              game_id = str(game_id)

              if game_id in artwork_lookup_cache:
                  return artwork_lookup_cache[game_id]

              params = urllib.parse.urlencode({
                  "i": game_id,
                  "y": api_key
              })

              url = (
                  "https://retroachievements.org/API/"
                  "API_GetGame.php?" + params
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GourmeHub/3.0"}
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      game_data = json.loads(
                          response.read().decode("utf-8")
                      )

                  # Prefer official box art.
                  image = (
                      game_data.get("ImageBoxArt")
                      or game_data.get("ImageIcon")
                      or game_data.get("GameIcon")
                  )

                  if image and image.startswith("/"):
                      image = "https://retroachievements.org" + image

                  if image and not image.startswith("https://"):
                      image = None

                  artwork_lookup_cache[game_id] = image

                  if image:
                      print(f"Found official artwork for game ID {game_id}.")
                  else:
                      print(f"No official artwork available for game ID {game_id}.")

                  return image

              except Exception as error:
                  print(
                      f"Artwork lookup failed for game ID {game_id}: {error}"
                  )
                  artwork_lookup_cache[game_id] = None
                  return None

          def get_recent():
              params = urllib.parse.urlencode({
                  "u": USERNAME,
                  "m": LOOKBACK_MINUTES,
                  "y": api_key
              })

              url = (
                  "https://retroachievements.org/API/"
                  "API_GetUserRecentAchievements.php?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GourmeHub/3.0"}
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))

              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"RetroAchievements API returned HTTP {error.code}."
                  ) from error

              if not isinstance(data, list):
                  raise RuntimeError(
                      "Unexpected response from RetroAchievements API."
                  )

              return data

          def send_notification(achievement):
              title = achievement.get("Title", "Achievement unlocked")
              game = achievement.get("GameTitle", "Unknown game")
              points = achievement.get("Points", 0)
              achievement_id = achievement.get("AchievementID")
              game_id = achievement.get("GameID")

              mode = (
                  "Hardcore"
                  if int(achievement.get("HardcoreMode") or 0)
                  else "Softcore"
              )

              message = (
                  f"🏆 {title}\n\n"
                  f"🎮 Game: {game}\n"
                  f"⭐ Points: {points}\n"
                  f"🎯 Mode: {mode}\n"
                  f"👤 Player: {USERNAME}"
              )

              if achievement_id:
                  message += (
                      "\n\nView achievement: "
                      "https://retroachievements.org/achievement/"
                      f"{achievement_id}"
                  )

              if game_id:
                  message += (
                      "\nView game: "
                      f"https://retroachievements.org/game/{game_id}"
                  )

              headers = {
                  "Content-Type": "text/plain; charset=utf-8",
                  "Title": f"Achievement unlocked: {game}",
                  "Priority": "high",
                  "Tags": "trophy,video_game"
              }

              # First try the local artwork library.
              artwork = game_art.get(str(game_id)) if game_id else None

              # If missing, request artwork directly from RetroAchievements.
              if not artwork and game_id:
                  print(f"Local artwork missing for {game}.")
                  artwork = get_game_artwork(game_id)

              if artwork:
                  headers["Icon"] = artwork
                  print(f"Using artwork for: {game}")
              else:
                  print(f"Sending notification without artwork for: {game}")

              encoded_topic = urllib.parse.quote(topic, safe="")
              url = f"https://ntfy.sh/{encoded_topic}"

              request = urllib.request.Request(
                  url,
                  data=message.encode("utf-8"),
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.loads(response.read().decode("utf-8"))

                      print(
                          f"NTFY ACCEPTED: {title} — {game} "
                          f"(HTTP {response.status})"
                      )

                      return result

              except urllib.error.HTTPError as error:
                  details = error.read().decode(
                      "utf-8", errors="replace"
                  )

                  print(f"ntfy response: {details}")

                  raise RuntimeError(
                      f"ntfy rejected the notification: HTTP {error.code}."
                  ) from error

          # Load notification history.
          state_path.parent.mkdir(parents=True, exist_ok=True)

          if state_path.exists():
              try:
                  stored = json.loads(state_path.read_text())

                  if not isinstance(stored, list):
                      raise ValueError("History must be a JSON list.")

                  seen = set(str(item) for item in stored)

              except (json.JSONDecodeError, ValueError, TypeError) as error:
                  raise RuntimeError(
                      "Notification history is invalid."
                  ) from error
          else:
              seen = set()

          print(
              f"Checking achievements from the last "
              f"{LOOKBACK_MINUTES} minutes..."
          )

          recent = get_recent()

          print(
              f"RetroAchievements returned {len(recent)} recent unlocks."
          )

          new_items = [
              item for item in recent
              if item.get("AchievementID")
              and str(item["AchievementID"]) not in seen
          ]

          print(f"New achievements to notify: {len(new_items)}")

          sent_ids = []

          for item in reversed(new_items):
              send_notification(item)
              sent_ids.append(str(item["AchievementID"]))

          seen.update(sent_ids)

          state_path.write_text(
              json.dumps(sorted(seen), indent=2) + "\n"
          )

          print(
              f"Notification history now contains {len(seen)} IDs."
          )

          print(
              f"Successfully sent {len(sent_ids)} phone notification(s)."
          )
          PY

      - name: Save notification history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified-achievements.json
          git diff --cached --quiet || git commit -m "Track phone achievement notifications"
          git push
          
