
name: RetroAchievements Phone Notifications

on:
  workflow_dispatch:
    inputs:
      resend_achievement_id:
        description: "Achievement ID to resend (leave blank for normal checking)"
        required: false
        type: string
        default: ""
      resend_last_hour:
        description: "Resend every achievement earned in the last 60 minutes"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: achievement-phone-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check achievements and notify phone
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_ACHIEVEMENT_ID: ${{ inputs.resend_achievement_id }}
          RESEND_LAST_HOUR: ${{ inputs.resend_last_hour }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path

          USERNAME = "Gourmetal"
          LOOKBACK_MINUTES = 60
          UNLOCK_PAGE_SIZE = 500

          api_key = os.environ.get("RA_API_KEY")
          topic = os.environ.get("NTFY_TOPIC")
          resend_id = os.environ.get("RESEND_ACHIEVEMENT_ID", "").strip()
          resend_last_hour = os.environ.get("RESEND_LAST_HOUR", "false").lower() == "true"

          state_path = Path("data/notified-achievements.json")
          games_path = Path("data/games.json")

          if not api_key:
              raise RuntimeError("GitHub secret RA_API_KEY is missing.")

          if not topic:
              raise RuntimeError("GitHub secret NTFY_TOPIC is missing.")

          def api_get(endpoint, params):
              query = dict(params)
              query["y"] = api_key

              url = (
                  "https://retroachievements.org/API/"
                  + endpoint
                  + "?"
                  + urllib.parse.urlencode(query)
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GourmeHub/3.0"}
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"{endpoint} returned HTTP {error.code}: {details}"
                  ) from error

          # Load game artwork from the dashboard library.
          game_art = {}

          if games_path.exists():
              try:
                  library = json.loads(games_path.read_text())

                  for game in library.get("games", []):
                      game_id = game.get("gameId")
                      artwork = game.get("boxArt")

                      if game_id and artwork:
                          if artwork.startswith("https://"):
                              game_art[str(game_id)] = artwork
                          elif artwork.startswith("/"):
                              game_art[str(game_id)] = (
                                  "https://retroachievements.org" + artwork
                              )
              except (json.JSONDecodeError, AttributeError, TypeError):
                  print("Could not read local artwork library.")

          artwork_lookup_cache = {}

          def get_game_artwork(game_id):
              game_id = str(game_id)

              if game_id in artwork_lookup_cache:
                  return artwork_lookup_cache[game_id]

              try:
                  data = api_get("API_GetGame.php", {"i": game_id})

                  image = (
                      data.get("ImageBoxArt")
                      or data.get("ImageIcon")
                      or data.get("GameIcon")
                  )

                  if image and image.startswith("/"):
                      image = "https://retroachievements.org" + image

                  if image and not image.startswith("https://"):
                      image = None

                  artwork_lookup_cache[game_id] = image
                  return image

              except Exception as error:
                  print(f"Artwork lookup failed: {error}")
                  artwork_lookup_cache[game_id] = None
                  return None

          def get_recent():
              data = api_get(
                  "API_GetUserRecentAchievements.php",
                  {
                      "u": USERNAME,
                      "m": LOOKBACK_MINUTES
                  }
              )

              if not isinstance(data, list):
                  raise RuntimeError(
                      "Unexpected response from recent achievements API."
                  )

              return data

          def get_rarity_text(achievement):
              # Only show a percentage when the API explicitly supplies one.
              for field in ("Rarity", "RarityPercent", "RarityPercentage"):
                  value = achievement.get(field)

                  if value is not None:
                      try:
                          return f"💎 Rarity: {float(value):g}%"
                      except (ValueError, TypeError):
                          pass

              ratio = achievement.get("TrueRatio")

              if ratio is not None:
                  try:
                      return f"✨ True Ratio: {float(ratio):g}"
                  except (ValueError, TypeError):
                      pass

              return None

          def send_notification(achievement):
              title = achievement.get("Title") or "Achievement unlocked"
              game = achievement.get("GameTitle") or "Unknown game"
              description = (
                  achievement.get("Description")
                  or achievement.get("AchievementDescription")
                  or "No description was provided by RetroAchievements."
              )

              points = achievement.get("Points", 0)
              achievement_id = achievement.get("AchievementID")
              game_id = achievement.get("GameID")

              try:
                  points_number = int(points or 0)
              except (ValueError, TypeError):
                  points_number = 0

              hardcore = int(achievement.get("HardcoreMode") or 0) == 1
              mode = "HARDCORE" if hardcore else "SOFTCORE"

              achievement_url = None
              game_url = None

              if achievement_id:
                  achievement_url = (
                      "https://retroachievements.org/achievement/"
                      + str(achievement_id)
                  )

              if game_id:
                  game_url = (
                      "https://retroachievements.org/game/"
                      + str(game_id)
                  )

              # Special notification labels and priorities.
              tags = ["trophy", "video_game"]
              priority = "default"
              special_label = "🏆 ACHIEVEMENT UNLOCKED!"

              rarity_text = get_rarity_text(achievement)

              if points_number >= 50:
                  special_label = "🌟 BIG ACHIEVEMENT UNLOCKED!"
                  tags.append("star")
                  priority = "high"
              elif points_number >= 25:
                  special_label = "🏆 MAJOR ACHIEVEMENT UNLOCKED!"
                  tags.append("tada")
                  priority = "high"

              # True Ratio is a score, not a rarity percentage.
              # Use it only as an additional indicator, not as a percent.
              try:
                  true_ratio = float(achievement.get("TrueRatio") or 0)
                  if true_ratio >= 10:
                      special_label = "💎 CHALLENGING ACHIEVEMENT UNLOCKED!"
                      tags.append("gem")
                      priority = "high"
              except (ValueError, TypeError):
                  pass

              if hardcore:
                  tags.append("fire")
              else:
                  tags.append("video_game")

              # Keep the notification title ASCII for reliable HTTP headers.
              notification_title = f"Achievement unlocked: {game}"

              lines = [
                  special_label,
                  "",
                  f"🎮 {game}",
                  "",
                  f"🏅 {title}",
                  "",
                  "📜 DESCRIPTION",
                  description,
                  "",
                  f"⭐ POINTS: {points_number}",
                  f"🎯 MODE: {mode}",
                  f"👤 PLAYER: {USERNAME}"
              ]

              if rarity_text:
                  lines.extend(["", rarity_text])

              if achievement_url:
                  lines.extend([
                      "",
                      "🔗 VIEW ACHIEVEMENT",
                      achievement_url
                  ])

              if game_url:
                  lines.extend([
                      "",
                      "🕹️ VIEW GAME",
                      game_url
                  ])

              message = "\n".join(lines)

              headers = {
                  "Content-Type": "text/plain; charset=utf-8",
                  "Title": notification_title,
                  "Priority": priority,
                  "Tags": ",".join(tags)
              }

              artwork = game_art.get(str(game_id)) if game_id else None

              if not artwork and game_id:
                  artwork = get_game_artwork(game_id)

              if artwork:
                  headers["Icon"] = artwork
                  headers["Attach"] = artwork
                  print(f"Using game artwork for {game}.")

              if achievement_url:
                  headers["Click"] = achievement_url

              encoded_topic = urllib.parse.quote(topic, safe="")
              url = f"https://ntfy.sh/{encoded_topic}"

              request = urllib.request.Request(
                  url,
                  data=message.encode("utf-8"),
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.loads(response.read().decode("utf-8"))

                      print(
                          f"NTFY ACCEPTED: {title} — {game} "
                          f"(HTTP {response.status})"
                      )

                      return result

              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  print(f"ntfy response: {details}")

                  raise RuntimeError(
                      f"ntfy rejected notification: HTTP {error.code}."
                  ) from error

          # RESEND LAST HOUR MODE
          if resend_last_hour:
              if resend_id:
                  raise RuntimeError(
                      "Choose either a single achievement ID or the last-hour resend, not both."
                  )

              recent = get_recent()
              print(f"Found {len(recent)} achievement(s) in the last hour.")

              sent = 0

              for item in reversed(recent):
                  send_notification(item)
                  sent += 1

              print(f"Last-hour resend completed: {sent} notification(s).")
              print("Notification history was not changed.")

          # MANUAL RESEND MODE
          elif resend_id:
              if not resend_id.isdigit():
                  raise RuntimeError("Enter a numeric achievement ID.")

              achievement_data = api_get(
                  "API_GetAchievementUnlocks.php",
                  {
                      "a": resend_id,
                      "c": 1,
                      "o": 0
                  }
              )

              achievement_info = achievement_data.get("Achievement", {})
              game_info = achievement_data.get("Game", {})

              if not achievement_info.get("ID") or not game_info.get("ID"):
                  raise RuntimeError("Could not find that achievement ID.")

              earned = None
              offset = 0

              while True:
                  unlock_data = api_get(
                      "API_GetAchievementUnlocks.php",
                      {
                          "a": resend_id,
                          "c": UNLOCK_PAGE_SIZE,
                          "o": offset
                      }
                  )

                  unlocks = unlock_data.get("Unlocks", [])

                  if not isinstance(unlocks, list):
                      raise RuntimeError("Unexpected unlock history response.")

                  for unlock in unlocks:
                      if str(unlock.get("User", "")).strip().lower() == USERNAME.lower():
                          earned = unlock
                          break

                  if earned:
                      break

                  if len(unlocks) < UNLOCK_PAGE_SIZE:
                      break

                  offset += UNLOCK_PAGE_SIZE

              if not earned:
                  raise RuntimeError(
                      f"Achievement {resend_id} was not found in "
                      f"{USERNAME}'s unlock history."
                  )

              notification = {
                  "AchievementID": str(resend_id),
                  "Title": achievement_info.get("Title", "Achievement unlocked"),
                  "Description": achievement_info.get("Description", ""),
                  "Points": achievement_info.get("Points", 0),
                  "TrueRatio": achievement_info.get("TrueRatio"),
                  "Rarity": achievement_info.get("Rarity"),
                  "GameID": str(game_info["ID"]),
                  "GameTitle": game_info.get("Title", "Unknown game"),
                  "HardcoreMode": (
                      1 if str(earned.get("HardcoreMode", "0")) == "1" else 0
                  )
              }

              send_notification(notification)

              print("Manual resend completed.")
              print("Notification history was not changed.")

          # NORMAL AUTOMATIC CHECKING MODE
          else:
              state_path.parent.mkdir(parents=True, exist_ok=True)

              if state_path.exists():
                  try:
                      stored = json.loads(state_path.read_text())

                      if not isinstance(stored, list):
                          raise ValueError("History must be a JSON list.")

                      seen = set(str(item) for item in stored)

                  except (json.JSONDecodeError, ValueError, TypeError) as error:
                      raise RuntimeError(
                          "Notification history is invalid."
                      ) from error
              else:
                  seen = set()

              recent = get_recent()

              print(f"RetroAchievements returned {len(recent)} recent unlocks.")

              new_items = [
                  item for item in recent
                  if item.get("AchievementID")
                  and str(item["AchievementID"]) not in seen
              ]

              print(f"New achievements to notify: {len(new_items)}")

              sent_ids = []

              for item in reversed(new_items):
                  send_notification(item)
                  sent_ids.append(str(item["AchievementID"]))

              seen.update(sent_ids)

              state_path.write_text(
                  json.dumps(sorted(seen), indent=2) + "\n"
              )

              print(f"Notification history now contains {len(seen)} IDs.")
              print(f"Successfully sent {len(sent_ids)} notification(s).")
          PY

      - name: Save notification history
        if: ${{ inputs.resend_achievement_id == '' && inputs.resend_last_hour != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified-achievements.json
          git diff --cached --quiet || git commit -m "Track phone achievement notifications"
          git push
          
