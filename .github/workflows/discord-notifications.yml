
name: RetroAchievements Discord Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: discord-achievement-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for new achievements and notify Discord
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path

          USERNAME = "Gourmetal"
          LOOKBACK_MINUTES = 60
          state_path = Path("data/notified-achievements.json")

          api_key = os.environ.get("RA_API_KEY")
          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL")

          if not api_key:
              raise RuntimeError("GitHub secret RA_API_KEY is missing.")

          if not webhook_url:
              raise RuntimeError("GitHub secret DISCORD_WEBHOOK_URL is missing.")

          def get_recent():
              params = urllib.parse.urlencode({
                  "u": USERNAME,
                  "m": LOOKBACK_MINUTES,
                  "y": api_key
              })

              url = (
                  "https://retroachievements.org/API/"
                  "API_GetUserRecentAchievements.php?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GourmeHub/2.0"}
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"RetroAchievements API returned HTTP {error.code}."
                  ) from error

              if not isinstance(data, list):
                  raise RuntimeError(
                      "Unexpected response from RetroAchievements API."
                  )

              return data

          def send_discord(achievement):
              title = achievement.get("Title", "Achievement unlocked")
              game = achievement.get("GameTitle", "Unknown game")
              points = achievement.get("Points", 0)
              achievement_id = achievement.get("AchievementID")
              game_id = achievement.get("GameID")

              mode = (
                  "Hardcore"
                  if int(achievement.get("HardcoreMode") or 0)
                  else "Softcore"
              )

              fields = [
                  {"name": "Game", "value": str(game), "inline": False},
                  {"name": "Points", "value": str(points), "inline": True},
                  {"name": "Mode", "value": mode, "inline": True}
              ]

              if achievement_id:
                  fields.append({
                      "name": "Achievement",
                      "value": (
                          f"[View achievement]"
                          f"(https://retroachievements.org/achievement/"
                          f"{achievement_id})"
                      ),
                      "inline": False
                  })

              payload = {
                  "username": "RetroAchievements Bot",
                  "allowed_mentions": {"parse": []},
                  "embeds": [{
                      "title": "🏆 Achievement Unlocked!",
                      "description": f"**{title}**",
                      "color": 16742400,
                      "fields": fields,
                      "url": (
                          f"https://retroachievements.org/game/{game_id}"
                          if game_id else
                          "https://retroachievements.org"
                      ),
                      "footer": {"text": f"Player: {USERNAME}"}
                  }]
              }

              request = urllib.request.Request(
                  webhook_url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(
                          f"DISCORD ACCEPTED: {title} — {game} "
                          f"(HTTP {response.status})"
                      )
              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"Discord webhook rejected the message: HTTP {error.code}."
                  ) from error

          state_path.parent.mkdir(parents=True, exist_ok=True)

          if state_path.exists():
              try:
                  stored = json.loads(state_path.read_text())
                  if not isinstance(stored, list):
                      raise ValueError("History must be a JSON list.")
                  seen = set(str(item) for item in stored)
              except (json.JSONDecodeError, ValueError, TypeError) as error:
                  raise RuntimeError(
                      "Notification history is invalid."
                  ) from error
          else:
              seen = set()

          print(f"Checking achievements from the last {LOOKBACK_MINUTES} minutes...")

          recent = get_recent()
          print(f"RetroAchievements returned {len(recent)} recent unlocks.")

          new_items = [
              item for item in recent
              if item.get("AchievementID")
              and str(item["AchievementID"]) not in seen
          ]

          print(f"New achievements to notify: {len(new_items)}")

          sent_ids = []

          for item in reversed(new_items):
              send_discord(item)
              sent_ids.append(str(item["AchievementID"]))

          seen.update(sent_ids)

          state_path.write_text(
              json.dumps(sorted(seen), indent=2) + "\n"
          )

          print(f"Notification history now contains {len(seen)} achievement IDs.")
          print(f"Successfully sent {len(sent_ids)} Discord notification(s).")
          PY

      - name: Save notification history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified-achievements.json
          git diff --cached --quiet || git commit -m "Track Discord achievement notifications"
          git push
