name: RetroAchievements Phone Notifications

on:
  workflow_dispatch:
    inputs:
      resend_achievement_id:
        description: "Achievement ID to resend"
        required: false
        type: string
        default: ""
      resend_last_hour:
        description: "Resend achievements from the last hour"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: achievement-phone-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install artwork color sampler
        run: python -m pip install --quiet Pillow

      - name: Check achievements and notify phone
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_ACHIEVEMENT_ID: ${{ inputs.resend_achievement_id }}
          RESEND_LAST_HOUR: ${{ inputs.resend_last_hour }}
        run: |
