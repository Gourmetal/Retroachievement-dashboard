          def api_get(endpoint, params):
              query = dict(params, y=API_KEY)
              url = (
                  "https://retroachievements.org/API/"
                  + endpoint + "?" + urllib.parse.urlencode(query)
              )
              request = urllib.request.Request(
                  url, headers={"User-Agent": "GourmeHub/3.0"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"{endpoint} returned HTTP {error.code}: {details}"
                  ) from error

          def get_recent():
              data = api_get(
                  "API_GetUserRecentAchievements.php",
                  {"u": USER, "m": LOOKBACK_MINUTES}
              )
              if not isinstance(data, list):
                  raise RuntimeError(
                      "Unexpected recent achievements response."
                  )
              return data

          # Load game artwork from the dashboard library.
          game_art = {}

          if GAMES.exists():
              try:
                  library = json.loads(GAMES.read_text())
                  for game in library.get("games", []):
                      game_id = game.get("gameId")
                      art = game.get("boxArt")

                      if game_id and art:
                          if art.startswith("/"):
                              art = "https://retroachievements.org" + art

                          if art.startswith("https://"):
                              game_art[str(game_id)] = art

              except (json.JSONDecodeError, AttributeError, TypeError):
                  print("Could not read local artwork library.")

          artwork_cache = {}

          def get_artwork(game_id):
              game_id = str(game_id)

              if game_id in game_art:
                  return game_art[game_id]

              if game_id in artwork_cache:
                  return artwork_cache[game_id]

              try:
                  data = api_get("API_GetGame.php", {"i": game_id})
                  art = (
                      data.get("ImageBoxArt")
                      or data.get("ImageIcon")
                      or data.get("GameIcon")
                  )

                  if art and art.startswith("/"):
                      art = "https://retroachievements.org" + art

                  if art and not art.startswith("https://"):
                      art = None

              except Exception as error:
                  print(f"Artwork lookup failed: {error}")
                  art = None

              artwork_cache[game_id] = art
              return art

          def get_game_style(game):
              name = str(game or "").casefold()

              for keyword, style in THEMES.items():
                  if keyword in name:
                      banner, flavor, color, color_name = style
                      return {
                          "banner": banner,
                          "flavor": flavor,
                          "color": color,
                          "color_name": color_name
                      }

              return {
                  "banner": "🎮 RETRO GAMING UPDATE!",
                  "flavor": "Another achievement added to your collection.",
                  "color": None,
                  "color_name": "Game artwork"
              }

          def get_artwork_color(url):
              if not url:
                  return None

              try:
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "GourmeHub/3.0"}
                  )

                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read(8 * 1024 * 1024)

                  image = Image.open(io.BytesIO(raw)).convert("RGB")
                  image.thumbnail((96, 96))

                  quantized = image.quantize(
                      colors=8,
                      method=Image.Quantize.MEDIANCUT
                  )

                  palette = quantized.getpalette()
                  counts = quantized.getcolors(96 * 96) or []

                  if not counts or not palette:
                      return None

                  index = max(counts, key=lambda item: item[0])[1] * 3
                  red, green, blue = palette[index:index + 3]

                  return f"#{red:02X}{green:02X}{blue:02X}"

              except Exception as error:
                  print(f"Artwork color sampling failed: {error}")
                  return None

          def color_square(color):
              if not color or len(color) != 7:
                  return "⬜"

              red, green, blue = (
                  int(color[i:i + 2], 16) for i in (1, 3, 5)
              )

              if red > green * 1.25 and red > blue * 1.25:
                  return "🟥"
              if green > red * 1.2 and green > blue * 1.2:
                  return "🟩"
              if blue > red * 1.2 and blue > green * 1.1:
                  return "🟦"
              if red > 150 and green > 100 and blue < 120:
                  return "🟨"
              if red > 130 and blue > 130 and green < 150:
                  return "🟪"

              return "⬜"

          def rarity_text(item):
              for field in (
                  "Rarity",
                  "RarityPercent",
                  "RarityPercentage"
              ):
                  value = item.get(field)

                  if value is not None:
                      try:
                          return f"💎 Rarity: {float(value):g}%"
                      except (ValueError, TypeError):
                          pass

              return ""

          def send_notification(item):
              achievement_id = item.get("AchievementID")
              title = item.get("Title") or "Achievement unlocked!"
              description = item.get("Description") or ""
              points = item.get("Points", 0)
              game_id = item.get("GameID")
              game_title = item.get("GameTitle") or "Retro game"

              style = get_game_style(game_title)
              artwork = get_artwork(game_id)

              color = style["color"]
              source = style["color_name"] if color else "Game artwork"

              if not color:
                  color = get_artwork_color(artwork)

              if not color:
                  color = "#667788"
                  source = "Retro fallback"

              rarity = rarity_text(item)

              try:
                  points = int(points)
              except (ValueError, TypeError):
                  points = 0

              try:
                  hardcore = int(item.get("HardcoreMode") or 0) == 1
              except (ValueError, TypeError):
                  hardcore = False

              mode = "🔥 Hardcore" if hardcore else "🎮 Softcore"

              message_lines = [
                  style["flavor"],
                  "",
                  f"🏆 {title}",
                  description,
                  "",
                  f"🎮 {game_title}",
                  f"⭐ {points} points",
                  mode
              ]

              if rarity:
                  message_lines.extend(["", rarity])

              message_lines.extend([
                  "",
                  f"{color_square(color)} Theme: {source}",
                  f"Achievement ID: {achievement_id}"
              ])

              message = "\n".join(
                  line for line in message_lines if line is not None
              )

              headers = {
                  "Title": style["banner"],
                  "Priority": "default",
                  "Tags": "video_game,trophy",
                  "Content-Type": "text/plain; charset=utf-8",
                  "X-Title": style["banner"],
                  "X-Priority": "3",
                  "X-Tags": "video_game,trophy",
                  "X-Click": (
                      "https://retroachievements.org/"
                      f"achievement/{achievement_id}"
                  )
              }

              if artwork:
                  headers["Attach"] = artwork

              headers["Color"] = color

              request = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}",
                  data=message.encode("utf-8"),
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      print(
                          f"Notification sent for achievement "
                          f"{achievement_id}: HTTP {response.status}"
                      )

              except urllib.error.HTTPError as error:
                  details = error.read().decode(
                      "utf-8", errors="replace"
                  )
                  raise RuntimeError(
                      f"ntfy rejected notification: HTTP "
                      f"{error.code}: {details}"
                  ) from error
                            # MANUAL RESEND: LAST HOUR
          if RESEND_HOUR:
              if RESEND_ID:
                  raise RuntimeError(
                      "Choose either a single achievement ID "
                      "or the last-hour resend, not both."
                  )

              recent = get_recent()
              print(
                  f"Found {len(recent)} achievement(s) "
                  "in the last hour."
              )

              sent = 0

              for item in reversed(recent):
                  send_notification(item)
                  sent += 1

              print(
                  f"Last-hour resend completed: {sent} notification(s)."
              )
              print("Notification history was not changed.")

          # MANUAL RESEND: SINGLE ACHIEVEMENT
          elif RESEND_ID:
              if not RESEND_ID.isdigit():
                  raise RuntimeError(
                      "Enter a numeric achievement ID."
                  )

              data = api_get(
                  "API_GetAchievementUnlocks.php",
                  {"a": RESEND_ID, "c": 100, "o": 0}
              )

              achievement = data.get("Achievement", {})
              game = data.get("Game", {})
              unlocks = data.get("Unlocks", [])

              if not achievement.get("ID") or not game.get("ID"):
                  raise RuntimeError(
                      "Could not find that achievement ID."
                  )

              if not isinstance(unlocks, list):
                  raise RuntimeError(
                      "Unexpected achievement unlock response."
                  )

              player_unlocks = [
                  unlock for unlock in unlocks
                  if str(unlock.get("User", "")).casefold()
                  == USER.casefold()
              ]

              if not player_unlocks:
                  raise RuntimeError(
                      f"No unlock by {USER} was found for "
                      f"achievement {RESEND_ID}."
                  )

              unlock = player_unlocks[0]

              item = {
                  "AchievementID": achievement.get("ID"),
                  "Title": achievement.get("Title"),
                  "Description": achievement.get("Description"),
                  "Points": achievement.get("Points", 0),
                  "TrueRatio": achievement.get("TrueRatio"),
                  "GameID": game.get("ID"),
                  "GameTitle": game.get("Title"),
                  "HardcoreMode": unlock.get("HardcoreMode", 0)
              }

              send_notification(item)

              print(
                  f"Manual resend completed for achievement {RESEND_ID}."
              )

          # NORMAL AUTOMATIC CHECKING
          else:
              if HISTORY.exists():
                  try:
                      stored = json.loads(HISTORY.read_text())

                      if not isinstance(stored, list):
                          raise ValueError(
                              "History must be a JSON list."
                          )

                      seen = {
                          str(value) for value in stored
                      }

                  except (
                      json.JSONDecodeError,
                      ValueError,
                      TypeError
                  ) as error:
                      raise RuntimeError(
                          "Notification history is invalid."
                      ) from error

              else:
                  seen = set()

              recent = get_recent()

              print(
                  f"RetroAchievements returned {len(recent)} "
                  "recent unlocks."
              )

              new_items = [
                  item for item in recent
                  if item.get("AchievementID")
                  and str(item["AchievementID"]) not in seen
              ]

              print(
                  f"New achievements to notify: {len(new_items)}"
              )

              sent_ids = []

              for item in reversed(new_items):
                  send_notification(item)
                  sent_ids.append(
                      str(item["AchievementID"])
                  )

              seen.update(sent_ids)

              HISTORY.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              HISTORY.write_text(
                  json.dumps(sorted(seen), indent=2) + "\n"
              )

              print(
                  f"Notification history now contains "
                  f"{len(seen)} IDs."
              )

              print(
                  f"Successfully sent {len(sent_ids)} notification(s)."
              )
                     PY

      - name: Save notification history
        if: ${{ inputs.resend_achievement_id == '' && inputs.resend_last_hour != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified-achievements.json
          git diff --cached --quiet || git commit -m "Track phone achievement notifications"
          git push
