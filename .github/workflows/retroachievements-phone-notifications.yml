
name: RetroAchievements Phone Notifications

on:
  workflow_dispatch:
    inputs:
      resend_achievement_id:
        description: "Achievement ID to resend (leave blank for normal checking)"
        required: false
        type: string
        default: ""
      resend_last_hour:
        description: "Resend every achievement earned in the last 60 minutes"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: achievement-phone-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install artwork color sampler
        run: python -m pip install --quiet Pillow

