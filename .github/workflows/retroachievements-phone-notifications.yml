
name: RetroAchievements Phone Notifications

on:
  workflow_dispatch:
    inputs:
      resend_achievement_id:
        description: "Achievement ID to resend"
        required: false
        type: string
        default: ""
      resend_last_hour:
        description: "Resend achievements from the last hour"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: achievement-phone-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet Pillow

      - name: Check and send notifications
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_ID: ${{ inputs.resend_achievement_id }}
          RESEND_HOUR: ${{ inputs.resend_last_hour }}
        run: python scripts/ra_notify.py

      - name: Save notification history
        if: ${{ inputs.resend_achievement_id == '' && inputs.resend_last_hour != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notified-achievements.json
          git diff --cached --quiet || git commit -m "Update notification history"
          git push
          
