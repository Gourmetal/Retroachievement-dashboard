
name: Update RetroAchievements Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Update game progress and artwork
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from html.parser import HTMLParser

          username = "Gourmetal"
          ra_key = os.environ["RA_API_KEY"]
          sgdb_key = os.environ.get("SGDB_API_KEY", "")

          ra_root = "https://retroachievements.org"
          sgdb_root = "https://www.steamgriddb.com/api/v2"
          launchbox_root = "https://gamesdb.launchbox-app.com"

          def get_json(url, headers=None):
              request_headers = {
                  "User-Agent": "Gourmetal-Dashboard/1.0",
                  "Accept": "application/json"
              }

              if headers:
                  request_headers.update(headers)

              request = urllib.request.Request(
                  url,
                  headers=request_headers
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      body = response.read().decode("utf-8")
                      return json.loads(body)

              except urllib.error.HTTPError as error:
                  body = error.read().decode(
                      "utf-8", errors="replace"
                  )
                  print(
                      f"HTTP ERROR {error.code} for "
                      f"{urllib.parse.urlparse(url).path}"
                  )
                  print(f"Response: {body[:500]}")
                  raise

          def ra_data(endpoint, params):
              params["y"] = ra_key
              query = urllib.parse.urlencode(params)
              return get_json(
                  f"{ra_root}/API/{endpoint}?{query}"
              )

          def sgdb_data(endpoint):
              return get_json(
                  f"{sgdb_root}/{endpoint}",
                  {
                      "Authorization": f"Bearer {sgdb_key}"
                  }
              )

          if not sgdb_key:
              print("WARNING: SGDB_API_KEY secret is missing.")
          else:
              print("Testing SteamGridDB API connection...")
              test = sgdb_data("search/autocomplete/Zelda")
              print(
                  "SteamGridDB connection successful. "
                  f"Search returned {len(test.get('data') or [])} results."
              )

          # -----------------------------------------
          # STEAMGRIDDB ARTWORK CACHE
          # -----------------------------------------

          cache_path = "data/steamgriddb-cache.json"

          try:
              with open(cache_path, encoding="utf-8") as file:
                  artwork_cache = json.load(file)
          except (FileNotFoundError, json.JSONDecodeError):
              artwork_cache = {}

          def has_artwork(art):
              return bool(
                  art.get("gameId")
                  or art.get("grid")
                  or art.get("hero")
                  or art.get("logo")
                  or art.get("icon")
              )

          def get_artwork(title):
              empty_artwork = {
                  "gameId": None,
                  "grid": "",
                  "hero": "",
                  "logo": "",
                  "icon": ""
              }

              if not sgdb_key:
                  return empty_artwork

              cached = artwork_cache.get(title)

              if cached and has_artwork(cached):
                  return cached

              artwork = dict(empty_artwork)

              try:
                  search_names = {
                      "~Hack~ Pokémon Emerald Seaglass":
                          "Pokemon Emerald Seaglass",
                      "~Homebrew~ Goodboy Galaxy":
                          "Goodboy Galaxy"
                  }

                  search_title = search_names.get(title, title)
                  search_term = urllib.parse.quote(
                      search_title, safe=""
                  )

                  search = sgdb_data(
                      f"search/autocomplete/{search_term}"
                  )

                  matches = search.get("data") or []

                  if not matches:
                      print(
                          f"No SteamGridDB match found: {search_title}"
                      )
                      return artwork

                  sgdb_id = matches[0].get("id")

                  if not sgdb_id:
                      print(f"No SteamGridDB game ID: {search_title}")
                      return artwork

                  artwork["gameId"] = sgdb_id

                  endpoint_names = {
                      "grids": "grid",
                      "heroes": "hero",
                      "logos": "logo",
                      "icons": "icon"
                  }

                  for endpoint, key in endpoint_names.items():
                      try:
                          result = sgdb_data(
                              f"{endpoint}/game/{sgdb_id}"
                          )

                          assets = result.get("data") or []

                          if assets:
                              artwork[key] = (
                                  assets[0].get("url") or ""
                              )

                          print(
                              f"{title} - {endpoint}: "
                              f"{len(assets)} found"
                          )

                      except Exception as error:
                          print(
                              f"{title} - {endpoint} failed: "
                              f"{type(error).__name__}: {error}"
                          )

                  if has_artwork(artwork):
                      artwork_cache[title] = artwork
                  else:
                      print(f"No artwork assets found for {title}")

              except Exception as error:
                  print(
                      f"SteamGridDB lookup failed for {title}: "
                      f"{type(error).__name__}: {error}"
                  )

              time.sleep(0.3)
              return artwork

          # -----------------------------------------
          # LAUNCHBOX NORTH AMERICAN SPINE LOOKUP
          # -----------------------------------------

          spine_cache_path = "data/launchbox-spine-cache.json"

          try:
              with open(spine_cache_path, encoding="utf-8") as file:
                  launchbox_spine_cache = json.load(file)
          except (FileNotFoundError, json.JSONDecodeError):
              launchbox_spine_cache = {}

          class LaunchBoxLinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.current_href = None
                  self.current_text = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      self.current_href = dict(attrs).get("href")
                      self.current_text = []

              def handle_data(self, data):
                  if self.current_href is not None:
                      self.current_text.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self.current_href is not None:
                      self.links.append((
                          self.current_href,
                          " ".join(" ".join(self.current_text).split())
                      ))

                      self.current_href = None
                      self.current_text = []

          def get_launchbox_page(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; GourmeHub/1.0)",
                      "Accept": "text/html"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=25
              ) as response:
                  return response.read().decode(
                      "utf-8", errors="replace"
                  )

          def get_launchbox_spine(title, console):
              cached = launchbox_spine_cache.get(title)

              if (
                  isinstance(cached, str)
                  and cached.startswith("https://")
              ):
                  return cached

              search_url = (
                  f"{launchbox_root}/games/results?id="
                  f"{urllib.parse.quote(title, safe='')}"
              )

              try:
                  search_html = get_launchbox_page(search_url)

                  search_parser = LaunchBoxLinkParser()
                  search_parser.feed(search_html)

                  candidates = []

                  title_words = [
                      word.lower()
                      for word in title.replace(":", " ").split()
                      if len(word) > 2
                  ]

                  for href, link_text in search_parser.links:
                      if "/games/details/" not in (href or ""):
                          continue

                      normalized = link_text.lower()

                      if title_words and not all(
                          word in normalized
                          for word in title_words[:4]
                      ):
                          continue

                      if href.startswith("/"):
                          href = launchbox_root + href

                      if href.startswith(
                          launchbox_root + "/games/details/"
                      ):
                          if href not in candidates:
                              candidates.append(href)

                  for detail_url in candidates[:8]:
                      try:
                          detail_html = get_launchbox_page(
                              detail_url
                          )

                          detail_parser = LaunchBoxLinkParser()
                          detail_parser.feed(detail_html)

                          for href, link_text in detail_parser.links:
                              label = link_text.lower()

                              # Strictly North American spine images only.
                              if "box - spine" not in label:
                                  continue

                              if "north america" not in label:
                                  continue

                              if not href:
                                  continue

                              if href.startswith("//"):
                                  href = "https:" + href
                              elif href.startswith("/"):
                                  href = launchbox_root + href

                              if not href.startswith("https://"):
                                  continue

                              if not (
                                  "images.launchbox-app.com/" in href
                                  or "gamesdb-images.launchbox.gg/" in href
                              ):
                                  continue

                              launchbox_spine_cache[title] = href

                              print(
                                  "North American LaunchBox spine found: "
                                  f"{title}"
                              )

                              return href

                      except Exception as error:
                          print(
                              f"LaunchBox detail lookup failed for "
                              f"{title}: {type(error).__name__}: {error}"
                          )

              except Exception as error:
                  print(
                      f"LaunchBox search failed for {title}: "
                      f"{type(error).__name__}: {error}"
                  )

              # Do not cache missing results. Future runs can retry.
              print(
                  f"No North American LaunchBox spine found: {title}"
              )

              return ""

          # -----------------------------------------
          # RETROACHIEVEMENTS PLAYER PROFILE
          # -----------------------------------------

          profile_data = ra_data(
              "API_GetUserSummary.php",
              {"u": username, "g": 0, "a": 0}
          )

          avatar_path = profile_data.get("UserPic") or ""

          if avatar_path and not avatar_path.startswith("http"):
              avatar_path = ra_root + avatar_path

          profile = {
              "username": profile_data.get("User", username),
              "avatar": avatar_path,
              "memberSince": profile_data.get("MemberSince"),
              "motto": profile_data.get("Motto") or "",
              "rank": profile_data.get("Rank"),
              "totalRanked": profile_data.get("TotalRanked"),
              "hardcorePoints": profile_data.get("TotalPoints", 0),
              "softcorePoints": profile_data.get(
                  "TotalSoftcorePoints", 0
              ),
              "truePoints": profile_data.get("TotalTruePoints", 0)
          }

          # -----------------------------------------
          # LOAD ALL GAMES
          # -----------------------------------------

          all_games = []
          offset = 0
          total = None

          while total is None or offset < total:
              data = ra_data(
                  "API_GetUserCompletionProgress.php",
                  {"u": username, "c": 500, "o": offset}
              )

              total = data.get("Total", 0)
              results = data.get("Results", [])

              if not results:
                  break

              all_games.extend(results)
              offset += len(results)

          games = []

          for item in all_games:
              possible = int(item.get("MaxPossible") or 0)
              earned = int(item.get("NumAwarded") or 0)

              hardcore = int(
                  item.get("NumAwardedHardcore") or 0
              )

              progress = (
                  round(earned / possible * 100)
                  if possible else 0
              )

              games.append({
                  "gameId": item.get("GameID"),
                  "title": item.get("Title", "Unknown game"),
                  "console": item.get("ConsoleName", ""),
                  "earned": earned,
                  "hardcoreEarned": hardcore,
                  "total": possible,
                  "progress": progress,
                  "mode": "Softcore",
                  "lastPlayed": item.get(
                      "MostRecentAwardedDate"
                  )
              })

          # -----------------------------------------
          # LOAD GAME DETAILS, ACHIEVEMENTS AND ART
          # -----------------------------------------

          for game in games:
              game_id = game.get("gameId")

              if not game_id:
                  game["achievements"] = []
                  game["boxArt"] = ""
                  game["steamGridDB"] = {}
                  game["launchBoxSpine"] = ""
                  continue

              try:
                  detail = ra_data(
                      "API_GetGameInfoAndUserProgress.php",
                      {"u": username, "g": game_id}
                  )

                  image_path = (
                      detail.get("ImageBoxArt")
                      or detail.get("ImageIcon")
                  )

                  if image_path:
                      game["boxArt"] = (
                          image_path
                          if image_path.startswith("http")
                          else ra_root + image_path
                      )
                  else:
                      game["boxArt"] = ""

                  raw_achievements = (
                      detail.get("Achievements") or {}
                  )

                  game["achievements"] = [
                      {
                          "id": achievement.get(
                              "ID", achievement_id
                          ),
                          "badgeName": achievement.get(
                              "BadgeName", ""
                          ),
                          "title": achievement.get(
                              "Title", "Untitled achievement"
                          ),
                          "description": achievement.get(
                              "Description", ""
                          ),
                          "points": int(
                              achievement.get("Points") or 0
                          ),
                          "earned": bool(
                              achievement.get("DateEarned")
                          ),
                          "dateEarned": achievement.get(
                              "DateEarned"
                          ),
                          "hardcore": bool(
                              achievement.get(
                                  "DateEarnedHardcore"
                              )
                          ),
                          "dateEarnedHardcore": achievement.get(
                              "DateEarnedHardcore"
                          )
                      }
                      for achievement_id, achievement
                      in raw_achievements.items()
                  ]

                  game["achievements"].sort(
                      key=lambda achievement: (
                          not achievement["earned"],
                          achievement["title"].lower()
                      )
                  )

              except Exception as error:
                  print(
                      f"Could not load {game['title']}: {error}"
                  )

                  game["achievements"] = []
                  game["boxArt"] = ""

              game["steamGridDB"] = get_artwork(
                  game["title"]
              )

              game["launchBoxSpine"] = get_launchbox_spine(
                  game["title"],
                  game.get("console", "")
              )

              time.sleep(0.5)

          # -----------------------------------------
          # SORT GAMES AND BUILD DASHBOARD DATA
          # -----------------------------------------

          games.sort(
              key=lambda game: game["title"].lower()
          )

          output = {
              "username": username,
              "profile": profile,
              "lastUpdated": datetime.now(
                  timezone.utc
              ).isoformat(),
              "games": games,
              "recentAchievements": [],
              "stats": {
                  "gamesPlayed": len(games),
                  "achievementsEarned": sum(
                      game["earned"] for game in games
                  ),
                  "achievementsTotal": sum(
                      game["total"] for game in games
                  )
              }
          }

          os.makedirs("data", exist_ok=True)

          with open(
              "data/games.json", "w", encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

 
