                  file,
                  indent=2,
                  ensure_ascii=False
              )

          artwork_count = sum(
              has_artwork(game.get("steamGridDB") or {})
              for game in games
          )

          print(f"Updated dashboard with {len(games)} games.")
          print(f"Profile loaded for {profile['username']}.")
          print(
              f"Games with SteamGridDB artwork: {artwork_count}"
          )
          print("SteamGridDB artwork cache saved.")
          PY

      - name: Save updated game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/steamgriddb-cache.json
          git diff --cached --quiet || git commit -m "Update RetroAchievements game progress and artwork"
          git push
