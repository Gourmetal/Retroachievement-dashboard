
name: Update RetroAchievements Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Update game progress
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
  

          username = "Gourmetal"
          api_key = os.environ["RA_API_KEY"]
          base = "https://retroachievements.org/API/API_GetUserCompletionProgress.php"

          all_games = []
          offset = 0
          total = None

          while total is None or offset < total:
              params = urllib.parse.urlencode({
                  "u": username,
                  "y": api_key,
                  "c": 500,
                  "o": offset
              })

              request = urllib.request.Request(
                  f"{base}?{params}",
                  headers={"User-Agent": "Gourmetal-Dashboard/1.0"}
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))

              total = data.get("Total", 0)
              results = data.get("Results", [])
              if not results:
                  break

              all_games.extend(results)
              offset += len(results)

          games = []

          for item in all_games:
              possible = int(item.get("MaxPossible") or 0)
              earned = int(item.get("NumAwarded") or 0)
              hardcore = int(item.get("NumAwardedHardcore") or 0)

              progress = round(earned / possible * 100) if possible else 0

              games.append({
                  "gameId": item.get("GameID"),
                  "title": item.get("Title", "Unknown game"),
                  "console": item.get("ConsoleName", ""),
                  "earned": earned,
                  "hardcoreEarned": hardcore,
                  "total": possible,
                  "progress": progress,
                  "mode": "Softcore",
                  "lastPlayed": item.get("MostRecentAwardedDate")
              })

          games.sort(key=lambda game: game["title"].lower())

          output = {
              "username": username,
              "lastUpdated": datetime.now(timezone.utc).isoformat(),
              "games": games,
              "recentAchievements": [],
              "stats": {
                  "gamesPlayed": len(games),
                  "achievementsEarned": sum(g["earned"] for g in games),
                  "achievementsTotal": sum(g["total"] for g in games)
              }
          }

          os.makedirs("data", exist_ok=True)

          with open("data/games.json", "w", encoding="utf-8") as file:
              json.dump(output, file, indent=2, ensure_ascii=False)

          print(f"Updated dashboard with {len(games)} games.")
          PY

      - name: Save updated game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git diff --cached --quiet || git commit -m "Update RetroAchievements game progress"
          git push
