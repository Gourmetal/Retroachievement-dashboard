                          "title": achievement.get(
                              "Title", "Untitled achievement"
                          ),
                          "description": achievement.get(
                              "Description", ""
                          ),
                          "points": int(
                              achievement.get("Points") or 0
                          ),
                          "earned": bool(
                              achievement.get("DateEarned")
                          ),
                          "dateEarned": achievement.get(
                              "DateEarned"
                          ),
                          "hardcore": bool(
                              achievement.get(
                                  "DateEarnedHardcore"
                              )
