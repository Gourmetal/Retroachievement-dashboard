
name: Update RetroAchievements Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Update game progress and player profile
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          username = "Gourmetal"
          api_key = os.environ["RA_API_KEY"]
          api_root = "https://retroachievements.org"

          def get_api_data(endpoint, params):
              params["y"] = api_key
              query = urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  f"{api_root}/API/{endpoint}?{query}",
                  headers={"User-Agent": "Gourmetal-Dashboard/1.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          # Get player profile information
          profile_data = get_api_data(
              "API_GetUserSummary.php",
              {"u": username, "g": 0, "a": 0}
          )

          avatar_path = profile_data.get("UserPic") or ""

          if avatar_path and not avatar_path.startswith("http"):
              avatar_path = api_root + avatar_path

          profile = {
              "username": profile_data.get("User", username),
              "avatar": avatar_path,
              "memberSince": profile_data.get("MemberSince"),
              "motto": profile_data.get("Motto") or "",
              "rank": profile_data.get("Rank"),
              "totalRanked": profile_data.get("TotalRanked"),
              "hardcorePoints": profile_data.get("TotalPoints", 0),
              "softcorePoints": profile_data.get("TotalSoftcorePoints", 0),
              "truePoints": profile_data.get("TotalTruePoints", 0)
          }

          # Get all played games
          base = "API_GetUserCompletionProgress.php"
          all_games = []
          offset = 0
          total = None

          while total is None or offset < total:
              data = get_api_data(
                  base,
                  {"u": username, "c": 500, "o": offset}
              )

              total = data.get("Total", 0)
              results = data.get("Results", [])

              if not results:
                  break

              all_games.extend(results)
              offset += len(results)

          games = []

          for item in all_games:
              possible = int(item.get("MaxPossible") or 0)
              earned = int(item.get("NumAwarded") or 0)
              hardcore = int(item.get("NumAwardedHardcore") or 0)

              progress = round(earned / possible * 100) if possible else 0

              games.append({
                  "gameId": item.get("GameID"),
                  "title": item.get("Title", "Unknown game"),
                  "console": item.get("ConsoleName", ""),
                  "earned": earned,
                  "hardcoreEarned": hardcore,
                  "total": possible,
                  "progress": progress,
                  "mode": "Softcore",
                  "lastPlayed": item.get("MostRecentAwardedDate")
              })

          # Get achievement details for each game
          detail_base = "API_GetGameInfoAndUserProgress.php"

          for game in games:
              game_id = game.get("gameId")

              if not game_id:
                  game["achievements"] = []
                  game["boxArt"] = ""
                  continue

              try:
                  detail = get_api_data(
                      detail_base,
                      {"u": username, "g": game_id}
                  )

                  image_path = detail.get("ImageBoxArt") or detail.get("ImageIcon")

                  if image_path:
                      game["boxArt"] = (
                          image_path if image_path.startswith("http")
                          else api_root + image_path
                      )
                  else:
                      game["boxArt"] = ""

                  raw_achievements = detail.get("Achievements") or {}

                  game["achievements"] = [
                      {
                          "id": achievement.get("ID", achievement_id),
                          "title": achievement.get("Title", "Untitled achievement"),
                          "description": achievement.get("Description", ""),
                          "points": int(achievement.get("Points") or 0),
                          "earned": bool(achievement.get("DateEarned")),
                          "dateEarned": achievement.get("DateEarned"),
                          "hardcore": bool(achievement.get("DateEarnedHardcore")),
                          "dateEarnedHardcore": achievement.get("DateEarnedHardcore")
                      }
                      for achievement_id, achievement in raw_achievements.items()
                  ]

                  game["achievements"].sort(
                      key=lambda item: (
                          not item["earned"],
                          item["title"].lower()
                      )
                  )

              except Exception as error:
                  print(f"Could not load {game['title']}: {error}")
                  game["achievements"] = []
                  game["boxArt"] = ""

              time.sleep(0.5)

          games.sort(key=lambda game: game["title"].lower())

          output = {
              "username": username,
              "profile": profile,
              "lastUpdated": datetime.now(timezone.utc).isoformat(),
              "games": games,
              "recentAchievements": [],
              "stats": {
                  "gamesPlayed": len(games),
                  "achievementsEarned": sum(game["earned"] for game in games),
                  "achievementsTotal": sum(game["total"] for game in games)
              }
          }

          os.makedirs("data", exist_ok=True)

          with open("data/games.json", "w", encoding="utf-8") as file:
              json.dump(output, file, indent=2, ensure_ascii=False)

          print(f"Updated dashboard with {len(games)} games.")
          print(f"Profile loaded for {profile['username']}.")
          PY

      - name: Save updated game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git diff --cached --quiet || git commit -m "Update RetroAchievements game progress"
          git push
