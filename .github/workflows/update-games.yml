
name: Update RetroAchievements Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update game progress and artwork
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: python scripts/update_games.py

      - name: Save updated game data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/steamgriddb-cache.json data/launchbox-spine-cache.json
          git diff --cached --quiet || git commit -m "Update RetroAchievements progress and artwork"
          git push
          
